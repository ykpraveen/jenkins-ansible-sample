networks:
  fleet_net:
    driver: bridge
    # Fixed name so it doesn't depend on the compose project/directory name — the
    # Docker Cloud agent template in jenkins/casc/jenkins.yaml references it directly.
    name: fleet_net

volumes:
  registry_data:
  dev_docker_data:
  staging_docker_data:
  prod1_docker_data:
  prod2_docker_data:
  jenkins_home:

services:
  registry:
    image: registry:2
    networks:
      - fleet_net
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry

  traefik:
    # Docker Engine 29 dropped API 1.24 support entirely, and every traefik release
    # before 3.6.1 hardcodes 1.24 for its docker provider (DOCKER_API_VERSION is
    # ignored) — traefik/traefik#12253, fixed by #12256. Needs 3.6.1+.
    image: traefik:v3.6.1
    command: ["--configFile=/etc/traefik/traefik.yml"]
    networks:
      - fleet_net
    ports:
      - "8081:80"
      - "8082:8080"
    volumes:
      - ./docker/loadbalancer/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  fleet-dev:
    build: docker/ssh-fleet
    hostname: dev
    privileged: true
    networks:
      fleet_net:
        aliases: [dev]
    ports:
      - "2201:22"
    volumes:
      - dev_docker_data:/var/lib/docker
      - ./secrets/ssh/id_ed25519.pub:/run/ssh-fleet/authorized_keys:ro

  fleet-staging:
    build: docker/ssh-fleet
    hostname: staging
    privileged: true
    networks:
      fleet_net:
        aliases: [staging]
    ports:
      - "2202:22"
    volumes:
      - staging_docker_data:/var/lib/docker
      - ./secrets/ssh/id_ed25519.pub:/run/ssh-fleet/authorized_keys:ro

  fleet-prod1:
    build: docker/ssh-fleet
    hostname: prod1
    privileged: true
    networks:
      fleet_net:
        aliases: [prod1]
    ports:
      - "2211:22"
    volumes:
      - prod1_docker_data:/var/lib/docker
      - ./secrets/ssh/id_ed25519.pub:/run/ssh-fleet/authorized_keys:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=PathPrefix(`/`)
      - traefik.http.services.app.loadbalancer.server.port=8080

  fleet-prod2:
    build: docker/ssh-fleet
    hostname: prod2
    privileged: true
    networks:
      fleet_net:
        aliases: [prod2]
    ports:
      - "2212:22"
    volumes:
      - prod2_docker_data:/var/lib/docker
      - ./secrets/ssh/id_ed25519.pub:/run/ssh-fleet/authorized_keys:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=PathPrefix(`/`)
      - traefik.http.services.app.loadbalancer.server.port=8080

  ansible-control:
    build: docker/ansible-control
    profiles: ["tools"]
    networks:
      - fleet_net
    environment:
      - ANSIBLE_VAULT_PASSWORD
      - HOME=/tmp
      - ANSIBLE_GALAXY_IGNORE_CERTS
    volumes:
      - ./ansible:/ansible
      # yamllint's config auto-discovery only checks the current directory (WORKDIR
      # /ansible), so the repo-root .yamllint has to be mounted in explicitly —
      # without it, `yamllint .` silently falls back to its 80-char default instead
      # of this repo's 130.
      - ./.yamllint:/ansible/.yamllint:ro
      - ./secrets/ssh/id_ed25519:/secrets/id_ed25519:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # Build-only: tags the image the Docker Cloud agent template in
  # jenkins/casc/jenkins.yaml launches agents from. `docker compose build
  # jenkins-agent-image` (re)builds it; it never runs via `up`.
  jenkins-agent-image:
    build: jenkins/agent
    image: jenkins-ansible-sample-agent:latest
    profiles: ["tools"]

  jenkins-controller:
    build:
      context: jenkins/controller
      args:
        JENKINS_TRUST_OBSERVED_TLS_CERT: ${JENKINS_TRUST_OBSERVED_TLS_CERT:-false}
    networks:
      - fleet_net
    ports:
      - "8080:8080"
    # Unlike ansible-control (runs as root), this image's Dockerfile ends with
    # USER jenkins — a non-root user with no default access to the bind-mounted
    # docker.sock below, which is root:docker-owned on the host. Without this, the
    # Docker Cloud in jenkins/casc/jenkins.yaml fails to provision agents silently
    # (no error in the build console, it just queues forever). Set DOCKER_GID to
    # your host's docker group gid if it isn't the common Debian/Ubuntu default:
    #   DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up -d jenkins-controller
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - JENKINS_ADMIN_ID
      - JENKINS_ADMIN_PASSWORD
      - ANSIBLE_VAULT_PASSWORD
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc:/var/jenkins_home/casc_configs:ro
      - ./secrets/ssh/id_ed25519:/run/secrets/fleet_ssh_private_key:ro
      # DooD, same tradeoff as ansible-control: lets the controller launch Docker
      # Cloud agents as sibling containers on the outer host's fleet_net.
      - /var/run/docker.sock:/var/run/docker.sock
