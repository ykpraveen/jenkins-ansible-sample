---
# On a corporate/TLS-inspecting network, the `dependency` step below (ansible-galaxy
# fetching community.docker from galaxy.ansible.com) can fail the same way the
# docker_engine role's apt/GPG fetches do — see the README's "Corporate network /
# TLS-inspecting proxy note". Fix there is an env var ansible-galaxy itself reads
# regardless of how it's invoked: ANSIBLE_GALAXY_IGNORE_CERTS=true.

driver:
  name: docker

platforms:
  - name: common-test
    image: debian:bookworm-slim
    command: sleep infinity
    pre_build_image: false

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      common-test:
        ansible_python_interpreter: /usr/bin/python3

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
