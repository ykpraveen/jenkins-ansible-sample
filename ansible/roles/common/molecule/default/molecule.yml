---
dependency:
  name: galaxy
  options:
    # See the "Corporate network / TLS-inspecting proxy note" in README.md — this
    # mirrors the same escape hatch used for the docker_engine role's apt/GPG fetches.
    ignore-certs: ${MOLECULE_GALAXY_IGNORE_CERTS:-false}

driver:
  name: docker

platforms:
  - name: common-test
    image: debian:bookworm-slim
    command: sleep infinity
    pre_build_image: false

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      common-test:
        ansible_python_interpreter: /usr/bin/python3

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
