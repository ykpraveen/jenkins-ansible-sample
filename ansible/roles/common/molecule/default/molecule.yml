---
# community.docker (needed by the docker driver's connection plugin) is baked into
# the ansible-control image at build time instead — see docker/ansible-control/Dockerfile
# and the README's "Corporate network / TLS-inspecting proxy note". Molecule's own
# dependency step would otherwise re-fetch it from galaxy.ansible.com on every test run
# and hit the same TLS-interception failure.
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: common-test
    image: debian:bookworm-slim
    command: sleep infinity
    pre_build_image: false

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      common-test:
        ansible_python_interpreter: /usr/bin/python3

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
