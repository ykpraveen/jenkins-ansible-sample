---
ansible_user: ansible
# fleet_ssh_private_key_file exists as its own var (rather than hardcoding the path
# below) so Jenkins can override it per-run to a temp key file it controls, without
# touching this default (which matches ansible-control's bind-mounted key).
fleet_ssh_private_key_file: /secrets/id_ed25519
ansible_ssh_private_key_file: "{{ fleet_ssh_private_key_file }}"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_python_interpreter: /usr/bin/python3

registry_host: registry
registry_port: 5000
registry: "{{ registry_host }}:{{ registry_port }}"

app_name: sample-app
app_port: 8080

app_secret_key: "{{ vault_app_secret_key }}"

# Sandbox-only login for the local Grafana dashboard (Phase 7) — not a real secret,
# same "insecure by design, called out explicitly" treatment as the local registry
# and Traefik's dashboard. Must match docker-compose.yml's GRAFANA_ADMIN_PASSWORD if
# you change it, since app_deploy uses these to post deploy-event annotations.
grafana_url: http://grafana:3000
grafana_admin_user: admin
grafana_admin_password: admin
