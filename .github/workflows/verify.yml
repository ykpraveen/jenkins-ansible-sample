name: Verify stack

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker & Compose versions
        run: |
          docker --version
          docker compose version

      - name: Lint the app Dockerfile with hadolint
        run: docker run --rm -i hadolint/hadolint < app/Dockerfile

      - name: Generate SSH keypair for the fleet
        run: ./scripts/setup.sh

      - name: Validate compose config
        run: docker compose config

      - name: Bring up the fleet, registry, and Traefik
        run: docker compose up -d --build

      - name: Wait for containers to report running
        run: |
          sleep 5
          docker compose ps

      - name: SSH into a fleet host as the ansible user
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i secrets/ssh/id_ed25519 -p 2201 ansible@localhost \
              'hostname && whoami'

      - name: Registry is reachable
        run: curl -sf http://localhost:5000/v2/

      - name: Traefik dashboard is reachable
        run: curl -sf http://localhost:8082/api/rawdata

      - name: Unit-test the app (gates the image build itself)
        run: docker build --target test ./app

      - name: Build the production app image
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA=${{ github.sha }} -t localhost:5000/sample-app:ci ./app

      - name: Push and pull the app image through the local registry
        run: |
          docker push localhost:5000/sample-app:ci
          docker rmi localhost:5000/sample-app:ci
          docker pull localhost:5000/sample-app:ci

      - name: App container serves /health and /version
        run: |
          docker run -d --rm --name app-smoke -p 18080:8080 localhost:5000/sample-app:ci
          sleep 2
          curl -sf http://localhost:18080/health
          curl -sf http://localhost:18080/version | grep -q '"git_sha"'
          docker stop app-smoke

      - name: App container fails health check when SIMULATE_FAILURE is set
        run: |
          docker run -d --rm --name app-smoke-broken -e SIMULATE_FAILURE=true -p 18081:8080 localhost:5000/sample-app:ci
          sleep 2
          ! curl -sf http://localhost:18081/health
          docker stop app-smoke-broken

      - name: Build the ansible-control image
        run: docker compose build ansible-control

      - name: Lint the Ansible layer (yamllint + ansible-lint)
        run: |
          docker compose run --rm ansible-control yamllint .
          docker compose run --rm ansible-control ansible-lint bootstrap.yml deploy.yml
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Bootstrap fleet hosts (common + docker_engine roles)
        run: docker compose run --rm ansible-control ansible-playbook bootstrap.yml
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Deploy the CI-built image to dev via Ansible
        run: >
          docker compose run --rm ansible-control
          ansible-playbook deploy.yml --limit dev -e app_deploy_app_image_tag=ci
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: App deployed by Ansible actually serves /health and /version
        run: |
          docker compose exec -T fleet-dev curl -sf http://localhost:8080/health
          docker compose exec -T fleet-dev curl -sf http://localhost:8080/version | grep -q '"git_sha"'

      - name: Inject a broken deploy and confirm Ansible rolls it back automatically
        run: |
          # Same tag as the last deploy, but forces SIMULATE_FAILURE=true — the
          # health check must fail, so this run itself is expected to fail.
          ! docker compose run --rm ansible-control \
            ansible-playbook deploy.yml --limit dev \
            -e app_deploy_app_image_tag=ci -e app_deploy_simulate_failure=true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Dev is healthy again after the rollback
        run: |
          docker compose exec -T fleet-dev curl -sf http://localhost:8080/health
          docker compose exec -T fleet-dev curl -sf http://localhost:8080/version | grep -q '"git_sha"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      # Phase 4: validate Jenkins JCasC config parses
